<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Data Management - ระบบเก็บข้อมูลสัตว์เลี้ยง</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* รีเซ็ตค่าพื้นฐาน */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #fef7f2;
            color: #2c3e50;
            padding: 30px 15px;
            min-height: 100vh;
        }

        /* ส่วนหัวข้อเว็บ */
        header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(211, 84, 0, 0.15);
        }

        header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        header p {
            font-size: 16px;
            color: #fdebd0;
            font-weight: 300;
        }

        /* กล่องเนื้อหาหลักแบ่งซ้าย-ขวา */
        .main-container {
            max-width: 1250px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 25px;
        }

        /* ฝั่งซ้าย: เมนูเลือกประเภทสัตว์เลี้ยง */
        .map-sidebar {
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid #f5e6dc;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: fit-content;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 700;
            color: #d35400;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ปุ่มเลือกประเภท */
        .region-btn {
            width: 100%;
            padding: 15px 18px;
            font-size: 15px;
            font-weight: 600;
            color: #5d6d7e;
            background-color: #fdfefe;
            border: 2px solid #ebedef;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .region-btn:hover {
            background-color: #fdf2e9;
            border-color: #fadbd8;
            color: #e67e22;
            transform: translateY(-2px);
        }

        .region-btn.active {
            background: linear-gradient(135deg, #e67e22, #d35400);
            border-color: #e67e22;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.3);
        }

        .region-btn::after {
            content: '➔';
            font-size: 13px;
            opacity: 0.7;
        }

        .region-btn.active::after {
            content: '🐾';
            opacity: 1;
        }

        /* ฝั่งขวา: พื้นที่จัดการข้อมูล */
        .content-area {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* ส่วนฟอร์มเพิ่มข้อมูล */
        .form-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid #f5e6dc;
        }

        .form-title {
            font-size: 18px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pet-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group-full {
            grid-column: span 2;
        }

        .form-control {
            display: flex;
            flex-direction: column;
            gap: 6px;
